name: Pinned TDLib app bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-app.yml'
      - 'Package.swift'
      - 'Scripts/build-tdlib.sh'
      - 'Scripts/dev-app.sh'
      - 'Scripts/tdlib-smoke.c'
      - 'Sources/**'
      - 'TDLIB.lock.json'
  pull_request:
    paths:
      - '.github/workflows/native-app.yml'
      - 'Package.swift'
      - 'Scripts/build-tdlib.sh'
      - 'Scripts/dev-app.sh'
      - 'Scripts/tdlib-smoke.c'
      - 'Sources/**'
      - 'TDLIB.lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned TDLib and Dev.app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          cmake --version
          uname -m
          test "$(uname -m)" = arm64

      - name: Build and verify pinned TDLib
        run: bash Scripts/build-tdlib.sh

      - name: Assemble and verify isolated Dev.app
        env:
          NETELEGRAM_SUPPORT_ROOT: ${{ runner.temp }}/netelegram-ci-support
        run: |
          bash Scripts/dev-app.sh
          APP=/private/tmp/NeTelegram-Dev.app
          test -x "$APP/Contents/MacOS/NeTelegram"
          test -f "$APP/Contents/Frameworks/libtdjson.dylib"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/lipo -verify_arch arm64 "$APP/Contents/MacOS/NeTelegram"
          /usr/bin/lipo -verify_arch arm64 "$APP/Contents/Frameworks/libtdjson.dylib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'org.affpapa.netelegram.dev'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" | grep -Fx '14.0'
          python3 -m json.tool "$APP/Contents/Resources/BuildInfo.json" >/dev/null
          REVIEW_DIR="${RUNNER_TEMP}/netelegram-review-bundle"
          mkdir -p "$REVIEW_DIR"
          ditto "$APP" "$REVIEW_DIR/NeTelegram-Dev.app"
          cp .build/canonical-dev-build/NeTelegram-Dev.build.json "$REVIEW_DIR/"

      - name: Upload reproducible development bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeTelegram-Dev-${{ github.sha }}-arm64
          path: ${{ runner.temp }}/netelegram-review-bundle/*
          if-no-files-found: error
          retention-days: 7
