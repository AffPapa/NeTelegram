name: Pinned TDLib app bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-app.yml'
      - 'Package.swift'
      - 'Scripts/build-tdlib.sh'
      - 'Scripts/dev-app.sh'
      - 'Scripts/tdlib-smoke.c'
      - 'Sources/**'
      - 'TDLIB.lock.json'
  pull_request:
    paths:
      - '.github/workflows/native-app.yml'
      - 'Package.swift'
      - 'Scripts/build-tdlib.sh'
      - 'Scripts/dev-app.sh'
      - 'Scripts/tdlib-smoke.c'
      - 'Sources/**'
      - 'TDLIB.lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned TDLib and Dev.app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          cmake --version
          uname -m
          test "$(uname -m)" = arm64

      - name: Restore pinned native dependency build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            .build/openssl-src
            .build/openssl-install
            .build/tdlib-src
            .build/tdlib-build
          key: macos-15-arm64-tdlib-${{ hashFiles('TDLIB.lock.json') }}

      - name: Build and verify pinned TDLib
        run: bash Scripts/build-tdlib.sh

      - name: Assemble and verify isolated Dev.app
        env:
          NETELEGRAM_SUPPORT_ROOT: ${{ runner.temp }}/netelegram-ci-support
        run: |
          bash Scripts/dev-app.sh
          APP=/private/tmp/NeTelegram-Dev.app
          test -x "$APP/Contents/MacOS/NeTelegram"
          test -f "$APP/Contents/Frameworks/libtdjson.dylib"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/lipo "$APP/Contents/MacOS/NeTelegram" -verify_arch arm64
          /usr/bin/lipo "$APP/Contents/Frameworks/libtdjson.dylib" -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'org.affpapa.netelegram.dev'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" | grep -Fx '14.0'
          python3 -m json.tool "$APP/Contents/Resources/BuildInfo.json" >/dev/null
          REVIEW_DIR="${RUNNER_TEMP}/netelegram-review-bundle"
          mkdir -p "$REVIEW_DIR"
          ditto "$APP" "$REVIEW_DIR/NeTelegram-Dev.app"
          cp .build/canonical-dev-build/NeTelegram-Dev.build.json "$REVIEW_DIR/"
          open -n "$APP" --args --app-support-root "$NETELEGRAM_SUPPORT_ROOT"
          for attempt in {1..30}; do
            if /usr/bin/pgrep -x NeTelegram >/dev/null; then break; fi
            sleep 1
          done
          /usr/bin/pgrep -x NeTelegram >/dev/null
          sleep 2
          /usr/sbin/screencapture -x "$REVIEW_DIR/NeTelegram-first-run.png"
          test -s "$REVIEW_DIR/NeTelegram-first-run.png"
          /usr/bin/osascript -e 'tell application id "org.affpapa.netelegram.dev" to quit'
          for attempt in {1..20}; do
            if ! /usr/bin/pgrep -x NeTelegram >/dev/null; then break; fi
            sleep 1
          done
          if /usr/bin/pgrep -x NeTelegram >/dev/null; then
            /usr/bin/pkill -TERM -x NeTelegram
            exit 1
          fi
      - name: Upload reproducible development bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeTelegram-Dev-${{ github.sha }}-arm64
          path: ${{ runner.temp }}/netelegram-review-bundle/*
          if-no-files-found: error
          retention-days: 7
