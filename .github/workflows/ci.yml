name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/NeTelegramCoreTests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/NeTelegramCoreTests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (Apple Silicon)
    # This suite contains cancellation/continuation scheduling tests. Keep
    # test execution serialized so runner scheduling cannot strand a test.
    runs-on: macos-15
    # The serial suite normally completes in under a minute. Bound silent
    # Swift Testing startup stalls so a wedged runner fails fast enough to
    # diagnose rather than consuming ten minutes without test output.
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

          echo "swift=$(swift --version | sed -n '1s/.*version \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Restore incremental SwiftPM build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .build
          key: macos-15-${{ steps.toolchain.outputs.arch }}-swift-${{ steps.toolchain.outputs.swift }}-xcode-${{ steps.toolchain.outputs.xcode }}-package-${{ hashFiles('Package.swift', 'TDLIB.lock.json') }}-${{ github.sha }}
          restore-keys: |
            macos-15-${{ steps.toolchain.outputs.arch }}-swift-${{ steps.toolchain.outputs.swift }}-xcode-${{ steps.toolchain.outputs.xcode }}-package-${{ hashFiles('Package.swift', 'TDLIB.lock.json') }}-

      - name: Probe Swift Testing runner
        # Probe the exact restore-cleanup isolation regression before the full
        # serial suite. This distinguishes a runner startup stall from a later
        # suite stall and validates the changed contract on the hosted toolchain.
        timeout-minutes: 2
        run: swift test --no-parallel --verbose --filter restoreCleanupFanoutDoesNotWaitForOneBlockedProfileBeforeQueueingOthers

      - name: Run core test suite
        # Keep the concurrency-sensitive suite serial. Verbose driver output
        # makes the handoff from build/link to test-runner startup observable.
        # The suite has completed in about a minute on hosted macOS; cap this
        # step separately so a silent runner startup stall fails in two minutes
        # instead of consuming the whole five-minute job timeout.
        timeout-minutes: 2
        run: swift test --no-parallel --verbose
