name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (Apple Silicon)
    # This suite contains cancellation/continuation scheduling tests. Keep
    # test execution serialized so runner scheduling cannot strand a test.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      - name: Build app and run core tests
        run: swift test --no-parallel
