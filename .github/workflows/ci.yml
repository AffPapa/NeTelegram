name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (Apple Silicon)
    # Keep CI on the same pinned Swift/Xcode generation used for the current
    # app build. macos-15 selected Swift 6.1.2/Xcode 16.4 and stalled one
    # cancellation-sensitive startup test despite the full suite passing on
    # Swift 6.4/Xcode 27 locally.
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      - name: Build app and run core tests
        run: swift test

      - name: Validate checked-in JSON
        run: |
          python3 -m json.tool ACCEPTANCE.json >/dev/null
          python3 -m json.tool CONTRACTS.json >/dev/null
          python3 -m json.tool TDLIB.lock.json >/dev/null
          python3 -m json.tool release-manifest.template.json >/dev/null
          python3 -m json.tool release-index.template.json >/dev/null
          python3 -m json.tool devlog-entry.template.json >/dev/null
