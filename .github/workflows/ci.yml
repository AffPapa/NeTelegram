name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'SPARKLE.lock.json'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/NeTelegramCoreTests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'SPARKLE.lock.json'
      - 'TDLIB.lock.json'
      - 'Sources/**'
      - 'Tests/NeTelegramCoreTests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (Apple Silicon)
    # This suite contains cancellation/continuation scheduling tests. Keep
    # test execution serialized so runner scheduling cannot strand a test.
    runs-on: macos-15
    # One test process avoids repeated SwiftPM/test-runner startup. A hosted
    # macOS capacity delay previously consumed the 2-minute step cap before
    # the full suite could report; allow one bounded run without probe churn.
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

          echo "swift=$(swift --version | sed -n '1s/.*version \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Restore incremental SwiftPM build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .build
          key: macos-15-${{ steps.toolchain.outputs.arch }}-swift-${{ steps.toolchain.outputs.swift }}-xcode-${{ steps.toolchain.outputs.xcode }}-package-${{ hashFiles('Package.swift', 'Package.resolved', 'TDLIB.lock.json') }}-${{ github.sha }}
          restore-keys: |
            macos-15-${{ steps.toolchain.outputs.arch }}-swift-${{ steps.toolchain.outputs.swift }}-xcode-${{ steps.toolchain.outputs.xcode }}-package-${{ hashFiles('Package.swift', 'Package.resolved', 'TDLIB.lock.json') }}-

      - name: Run core test suite
        # Keep the concurrency-sensitive suite serial. Verbose driver output
        # makes build/link and test progress observable. Local full-suite and
        # focused regressions remain the fast iteration loop; CI is one exact-
        # SHA full-suite gate, not a sequence of redundant test processes.
        timeout-minutes: 8
        run: swift test --no-parallel --verbose
