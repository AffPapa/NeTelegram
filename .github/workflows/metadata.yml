name: Metadata validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metadata.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'ACCEPTANCE.json'
      - 'CONTRACTS.json'
      - 'TDLIB.lock.json'
      - 'COUNTRY-DATA.lock.json'
      - 'SPARKLE.lock.json'
      - 'UPDATER-CONFIG.json'
      - 'Package.swift'
      - 'Package.resolved'
      - 'ThirdPartyLicenses/**'
      - 'PROJECT-STATE.json'
      - 'release-manifest.template.json'
      - 'release-index.template.json'
      - 'devlog-entry.template.json'
      - 'Scripts/validate_release.py'
      - 'Scripts/validate_checkpoint.py'
      - 'Scripts/generate_sbom.py'
      - 'Scripts/generate_release_notices.py'
      - 'Tests/release/**'
  pull_request:
    paths:
      - '.github/workflows/metadata.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'ACCEPTANCE.json'
      - 'CONTRACTS.json'
      - 'TDLIB.lock.json'
      - 'COUNTRY-DATA.lock.json'
      - 'SPARKLE.lock.json'
      - 'UPDATER-CONFIG.json'
      - 'Package.swift'
      - 'Package.resolved'
      - 'ThirdPartyLicenses/**'
      - 'PROJECT-STATE.json'
      - 'release-manifest.template.json'
      - 'release-index.template.json'
      - 'devlog-entry.template.json'
      - 'Scripts/validate_release.py'
      - 'Scripts/validate_checkpoint.py'
      - 'Scripts/generate_sbom.py'
      - 'Scripts/generate_release_notices.py'
      - 'Tests/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate checked-in JSON
        run: |
          python3 -m json.tool ACCEPTANCE.json >/dev/null
          python3 -m json.tool CONTRACTS.json >/dev/null
          python3 -m json.tool TDLIB.lock.json >/dev/null
          python3 -m json.tool COUNTRY-DATA.lock.json >/dev/null
          python3 -m json.tool SPARKLE.lock.json >/dev/null
          python3 -m json.tool UPDATER-CONFIG.json >/dev/null
          python3 -m json.tool Package.resolved >/dev/null
          python3 -m json.tool PROJECT-STATE.json >/dev/null
          python3 -m json.tool release-manifest.template.json >/dev/null
          python3 -m json.tool release-index.template.json >/dev/null
          python3 -m json.tool devlog-entry.template.json >/dev/null
          python3 Scripts/generate_sbom.py \
            --version 0.0.0-ci \
            --source-commit "$GITHUB_SHA" \
            --timestamp 2026-01-01T00:00:00Z \
            --output "$RUNNER_TEMP/netelegram-source-sbom.json"
          python3 -m json.tool "$RUNNER_TEMP/netelegram-source-sbom.json" >/dev/null
          python3 Scripts/generate_release_notices.py \
            --output "$RUNNER_TEMP/NeTelegram-THIRD-PARTY-NOTICES.txt"
          test -s "$RUNNER_TEMP/NeTelegram-THIRD-PARTY-NOTICES.txt"
          python3 Scripts/validate_checkpoint.py
          python3 -m unittest discover -s Tests/release -t . -p 'test_*.py' -v
